  <line x1="141" y1="80" x2="141" y2="114" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <!-- Handle on lid -->
  <path d="M112,80 L112,66 Q112,56 141,56 Q170,56 170,66 L170,80" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lock/clasp left -->
  <rect x="58" y="105" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="6"/>
  <!-- Lock/clasp right -->
  <rect x="207" y="105" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="6"/>
  <!-- Strap across box -->
  <line x1="44" y1="175" x2="239" y2="175" stroke="currentColor" stroke-width="6"/>
  <!-- Buckle center -->
